name: History long (2005~)

# 트렌드 템플릿이 2019년 이후에만 안 맞았나, 원래 안 되나 — 2004년부터 가격을 받아
# 2005~2018 을 같은 방식으로 진단한다. 무거워서(가격 20년치) 수동 실행 또는 이 파일을
# 고칠 때만 돈다. 캐시는 .cache-long 으로 3단계 캐시와 분리한다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/history_long.yml"

permissions:
  contents: read

concurrency:
  group: history-long-${{ github.ref }}
  cancel-in-progress: true

env:
  HISTORY_CACHE: ${{ github.workspace }}/.cache-long
  START: "2004-01-01"

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: pip install -r screener/requirements.txt

      - name: Unit tests
        run: |
          python screener/test_history.py
          python screener/test_spx.py
          python screener/test_template.py
          python screener/test_diagnose.py

      - name: Cache key
        id: key
        run: echo "prices=us-prices-long-v1-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore price cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache-long/us_prices.pkl
          key: ${{ steps.key.outputs.prices }}

      - name: Download prices (2004~)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python screener/history.py download --start "$START"

      - name: Save price cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache-long/us_prices.pkl
          key: ${{ steps.key.outputs.prices }}

      - name: S&P 500 members · prices · rebuild
        run: |
          set -o pipefail
          python screener/spx_validate.py members 2>&1 | tee report.txt
          python screener/spx_validate.py prices 2>&1 | tail -3 | tee -a report.txt
          python screener/spx_validate.py rebuild 2>&1 | tail -1 | tee -a report.txt

      - name: Diagnose (2005~)
        run: |
          set -o pipefail
          python screener/diagnose.py --json diagnose-long.json --periods \
            2005-01-01:2008-12-31,2009-01-01:2012-12-31,2013-01-01:2018-12-31,2019-01-01:2023-12-31,2024-01-01:2099-12-31 \
            2>&1 | tee -a report.txt

      - name: Summary
        if: always()
        run: |
          if [ -f report.txt ]; then
            { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-long
          path: |
            report.txt
            diagnose-long.json
