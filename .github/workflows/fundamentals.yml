name: Fundamentals

# Phase 1 — 펀더멘털 수집. 아직 일일 스크리너에 붙이지 않았다 (Phase 5에서 편입).
# 개발 환경은 금융 API가 네트워크 정책으로 막혀 있어 여기서만 실제로 돌 수 있다.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "공백으로 구분 (예: AAPL VLO 005930.KS)"
        required: true
      commit:
        description: "결과를 커밋할지 (true/false)"
        required: false
        default: "false"
      refresh_maps:
        description: "CIK·corp_code 매핑 캐시를 다시 받을지 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: pip install requests

      - name: Collect
        env:
          # Secret으로만 받는다 (저장소가 public이라 입력값은 로그에 그대로 남는다)
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          args=""
          if [ "${{ github.event.inputs.refresh_maps }}" = "true" ]; then
            args="--refresh-maps"
          fi
          python screener/fundamentals.py $args ${{ github.event.inputs.tickers }}

      - name: Compute metrics
        run: python screener/code33.py

      - name: Show result shape
        run: |
          for f in docs/data/fundamentals/*.json docs/data/fundamentals_kr/*.json; do
            [ -e "$f" ] || continue
            echo "===== $f ($(wc -c < "$f") bytes)"
            python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('  market',d['market'],'| 분기',len(d['quarters']),'| 연간',len(d['annuals']),'| 태그',d.get('revenue_tag')); [print('   ',{k:v for k,v in q.items() if k!='start'}) for q in d['quarters'][:4]]" "$f"
          done

      - name: Commit
        if: ${{ github.event.inputs.commit == 'true' }}
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs/data/fundamentals docs/data/fundamentals_kr \
                  docs/data/fundamentals.json docs/data/fundamentals_kr.json \
                  docs/data/cik_map.json docs/data/corp_code_kr.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "fundamentals: ${{ github.event.inputs.tickers }}"
          for i in 1 2 3; do
            if git pull --rebase --strategy-option=theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push failed, retrying ($i/3)..."
            sleep 10
          done
          exit 1
