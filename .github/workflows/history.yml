name: History (stage 3)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "가격 데이터 시작일 — 첫 신호는 이 날짜 + 400일 뒤"
        default: "2018-01-01"
  # 작업 브랜치에서 재구성 코드를 고치면 곧바로 실제 데이터로 돌린다.
  push:
    branches: ["claude/**"]
    paths:
      - "screener/history.py"
      - "screener/test_history.py"
      - "screener/candidates.py"
      - "screener/test_candidates.py"
      - "screener/pit_fund.py"
      - "screener/test_pit_fund.py"
      - "screener/fundamentals.py"
      - "screener/spx_validate.py"
      - "screener/test_spx.py"
      - "screener/template_check.py"
      - "screener/test_template.py"
      - "screener/diagnose.py"
      - "screener/test_diagnose.py"
      # 재구성은 스크리너의 임계값·지표를 그대로 따른다 — 스크리너가 바뀌면 다시 잰다
      - "screener/screener.py"
      - "screener/test_screener.py"
      - ".github/workflows/history.yml"

# 읽기만 한다 — 재구성 결과는 커밋하지 않는다 (수백 MB, 캐시·아티팩트로만).
permissions:
  contents: read

# 같은 브랜치에서 새로 푸시하면 앞선 실행은 취소한다 (무거운 작업).
concurrency:
  group: history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # 충실도 점검이 git 에 커밋된 실제 스냅샷을 읽는다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: pip install -r screener/requirements.txt

      - name: Unit tests
        run: |
          python screener/test_screener.py
          python screener/test_history.py
          python screener/test_robust.py
          python screener/test_papertrade.py
          python screener/test_validate.py
          python screener/test_backtest.py
          python screener/test_candidates.py
          python screener/test_pit_fund.py
          python screener/test_fundamentals.py
          python screener/test_code33.py
          python screener/test_spx.py
          python screener/test_template.py
          python screener/test_diagnose.py
          python screener/test_evalkit.py
          python screener/test_marketcap.py
          python screener/test_hypotheses.py
          python screener/test_earnings.py

      # 7년치 5천여 종목 일봉은 주 단위로 캐시한다 — 같은 주 재실행은 다시 받지 않는다.
      - name: Cache key
        id: key
        run: |
          echo "prices=us-prices-v2-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore price cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/us_prices.pkl
          key: ${{ steps.key.outputs.prices }}

      - name: Download prices
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          START: ${{ inputs.start || '2018-01-01' }}
        run: python screener/history.py download --start "$START"

      - name: Save price cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/us_prices.pkl
          key: ${{ steps.key.outputs.prices }}

      # S&P 500 시점별 구성종목(위키백과 변경 이력). SEC 추출에 옛 구성종목도 넣으려고
      # 먼저 받는다. 실패하면 S&P 500 검증만 빠진다.
      - name: S&P 500 members
        continue-on-error: true
        run: python screener/spx_validate.py members

      # 추출 대상이 구성종목 이력 유무에 따라 다르므로 캐시 키에 넣는다
      - name: SEC facts key
        id: fkey
        run: |
          tag=base; [ -f .cache/sp500_pit.json ] && tag=sp500
          echo "facts=us-facts-v3-$tag-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # 시점 기준 펀더멘털(C1·C2): SEC 일괄 XBRL(1GB 남짓)에서 필요한 태그만 추려
      # 주 단위로 캐시한다. 실패해도 가격 기반 후보는 그대로 돈다.
      - name: Restore SEC facts cache
        id: fcache
        uses: actions/cache/restore@v4
        with:
          path: .cache/us_facts.json.gz
          key: ${{ steps.fkey.outputs.facts }}

      - name: Download SEC facts
        id: facts
        if: steps.fcache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python screener/pit_fund.py download
          python screener/pit_fund.py extract
          rm -f .cache/companyfacts.zip

      - name: Save SEC facts cache
        if: steps.fcache.outputs.cache-hit != 'true' && steps.facts.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/us_facts.json.gz
          key: ${{ steps.fkey.outputs.facts }}

      - name: Fundamentals timeline
        if: hashFiles('.cache/us_facts.json.gz') != ''
        continue-on-error: true
        run: python screener/pit_fund.py timeline

      - name: Rebuild weekly lists
        run: python screener/history.py rebuild

      # 재구성이 실제 스냅샷과 다르면 아래 결과는 믿을 수 없다 — 먼저 잰다.
      - name: Fidelity
        run: |
          set -o pipefail
          python screener/history.py fidelity 2>&1 | tee report.txt

      # 후보 규칙(C3·C4·C5): 설계 기간을 통과한 후보만 보류 기간을 계산한다.
      - name: Candidates
        run: |
          set -o pipefail
          echo "" | tee -a report.txt
          echo "### 후보 규칙" | tee -a report.txt
          python screener/candidates.py --json candidates.json 2>&1 | tee -a report.txt

      # S&P 500 풀 · SPY 기준: 유니버스 밖 옛 구성종목 가격 + SPY → 시점별 풀 재구성 → 검증
      - name: S&P 500 validate
        if: hashFiles('.cache/sp500_pit.json') != ''
        run: |
          set -o pipefail
          python screener/spx_validate.py prices
          python screener/spx_validate.py rebuild
          echo "" | tee -a report.txt
          echo "### S&P 500 풀 · SPY 기준" | tee -a report.txt
          python screener/spx_validate.py validate --json spx.json 2>&1 | tee -a report.txt
          echo "" | tee -a report.txt
          echo "### 트렌드 템플릿 자체 vs SPY" | tee -a report.txt
          python screener/template_check.py --json template.json 2>&1 | tee -a report.txt
          echo "" | tee -a report.txt
          echo "### 진단 · 이상치" | tee -a report.txt
          python screener/diagnose.py --json diagnose.json 2>&1 | tee -a report.txt

      - name: Validate (trailing stop)
        run: |
          set -o pipefail
          echo "" | tee -a report.txt
          echo "### 3단계 · 추격손절" | tee -a report.txt
          python screener/history.py validate --stop -8 --no-target --trail -15 \
            --json history-trail.json 2>&1 | tee -a report.txt

      - name: Validate (fixed target)
        run: |
          set -o pipefail
          echo "" | tee -a report.txt
          echo "### 3단계 · 고정 익절" | tee -a report.txt
          python screener/history.py validate --stop -8 --target 25 \
            --json history-target.json 2>&1 | tee -a report.txt

      - name: Summary
        if: always()
        run: |
          if [ -f report.txt ]; then
            { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history
          path: |
            report.txt
            history-*.json
            candidates.json
            spx.json
            template.json
            diagnose.json
            .cache/us_fidelity.json
