name: On-demand Chart

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (e.g. AAPL or 000660.KS)"
        required: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: pip install -r screener/requirements.txt

      - name: Export single ticker
        run: python screener/ondemand.py "${{ github.event.inputs.ticker }}"

      - name: Commit result
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "ondemand chart: ${{ github.event.inputs.ticker }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push failed, retrying ($i/3)..."
            sleep 10
          done
          exit 1
