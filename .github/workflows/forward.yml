name: M9 forward paper (PLAN section 15)

# M9 실시간 모의. 예약 실행은 기본 브랜치(main)에서만 돈다 — T0 는 main 머지 뒤 수동 init 을 실행한 날이다.
# 브랜치에서는 코드가 바뀔 때 단위 테스트와 dry-run(임시 폴더에서 init→update, 커밋 없음)만 돈다.
on:
  schedule:
    # 미국 장 마감(16:00 ET) 뒤 — 22:30 UTC, 평일만
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "init(T0 확정, 한 번만) | update | verify | power | dry-run"
        required: true
        default: dry-run
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/forward.yml"
      - "screener/forward.py"
      - "screener/test_forward.py"
      - "screener/timing.py"

permissions:
  contents: write

concurrency:
  group: forward
  cancel-in-progress: false

env:
  TIMING_CACHE: ${{ github.workspace }}/.cache-timing

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: pip install -r screener/requirements.txt

      - name: Unit tests
        run: |
          python screener/test_timing.py
          python screener/test_timing_eval.py
          python screener/test_forward.py

      - name: Decide action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then a=update
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then a="${{ github.event.inputs.action }}"
          else a=dry-run; fi
          case "$a" in init|update|verify|power|dry-run) ;; *) echo "unknown action: $a"; exit 1;; esac
          # init/update 는 main 에서만 (기록은 main 의 forward/ 에 쌓인다)
          if [ "$a" = "init" ] || [ "$a" = "update" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "$a 는 main 에서만 실행한다 — dry-run 으로 대체"; a=dry-run; fi
          fi
          echo "action=$a" >> "$GITHUB_OUTPUT"

      - name: Run forward.py
        run: python screener/forward.py ${{ steps.act.outputs.action }}

      - name: Commit log (main only)
        if: steps.act.outputs.action == 'init' || steps.act.outputs.action == 'update'
        run: |
          git config user.name "forward-bot"
          git config user.email "actions@github.com"
          git add forward/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "forward: M9 모의 기록 $(date -u +%F) (${{ steps.act.outputs.action }})"
          for i in 1 2 3; do
            if git pull --rebase --strategy-option=theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push failed, retrying ($i/3)..."; sleep 10
          done
          exit 1
